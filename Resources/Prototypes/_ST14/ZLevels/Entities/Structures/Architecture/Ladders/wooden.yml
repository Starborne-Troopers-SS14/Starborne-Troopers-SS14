- type: entity
  id: ST14ZLevelsLadderWoodenBase
  abstract: true
  name: wooden ladder
  components:
  - type: Sprite
    sprite: _ST14/ZLevels/Structures/Architecture/Ladders/wooden.rsi
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 1
            max: 2
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent:
  - ST14ZLevelLadderBase
  - ST14ZLevelsLadderWoodenBase
  id: ST14ZLevelLadderWooden
  name: wooden ladder

- type: entity
  parent:
  - ST14ZLevelLadderCornerBase
  - ST14ZLevelsLadderWoodenBase
  id: ST14ZLevelLadderWoodenCorner
  name: wooden ladder
  suffix: Corner

- type: entity
  parent:
  - ST14ZLevelLadderCornerInnerBase
  - ST14ZLevelsLadderWoodenBase
  id: ST14ZLevelLadderWoodenCornerInner
  name: wooden ladder
  suffix: Inner Corner
