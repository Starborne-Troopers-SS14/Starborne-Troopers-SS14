# One mob per caste that has art. The castes in _ST14/Hive/castes.yml point at these.
# Balance against the troopers: a Morita bullet is 19 piercing at 10 shots a second, trooper armour takes 35-40% off
# slashes and a trooper dies at 200 damage. Bugs have no crit and no stamina, they fight until they drop.

# Warrior: the line bug. Survives a short burst, bites hard and leaps at the gunners.
- type: entity
  parent: [ ST14MobBugBase, ST14MobBugWarriorLook ]
  id: ST14MobBugWarrior
  name: warrior bug
  description: "The common soldier of the hive: four legs, a pair of claws and no fear."
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      250: Dead
  - type: DamageVisuals
    damageDivisor: 50
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 5.2
  - type: MeleeWeapon
    attackRate: 1.3
    damage:
      types:
        Slash: 14
  - type: ST14BugLunge
    distance: 4
    speed: 12
    knockdown: 1.5
    damage:
      types:
        Slash: 10
    sound:
      collection: ST14BugWarriorLunge
  - type: ST14SwarmResonance
  - type: ST14HiveGrab
    sound:
      collection: ST14BugWarriorTaunt
    releaseSound:
      collection: ST14BugWarriorAlarm
  - type: ST14LivingBarricade
    sound:
      collection: ST14BugWarriorRoar
    breakSound:
      collection: ST14BugWarriorAlarm
  - type: ST14HiveMember
    caste: ST14CasteWarrior

# Tiger: the killer. Fast, armoured against bullets, and spins through a whole squad.
- type: entity
  parent: [ ST14MobBugBase, ST14MobBugTigerLook, ST14MobBugSizeMedium ]
  id: ST14MobBugTiger
  name: tiger bug
  description: "A striped killer, fast and terribly sharp."
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      450: Dead
  - type: Damageable
    damageModifierSet: ST14BugTigerCarapace
  - type: DamageVisuals
    damageDivisor: 90
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 6
  - type: MeleeWeapon
    attackRate: 1.2
    soundHit:
      collection: ST14BugTigerAttack
    damage:
      types:
        Slash: 24
  - type: ST14BugRend
    range: 1.6
    stun: 0.6
    damage:
      types:
        Slash: 22
    sound:
      collection: ST14BugTigerRend
  - type: ST14BugExecute
    healthThreshold: 0.3
    heal: 50
    damage:
      types:
        Slash: 24
    leapSound:
      collection: ST14BugTigerRoar
    killSound:
      collection: ST14BugTigerAttack
      params:
        volume: 4
  - type: ST14BloodScent
  - type: ST14LastRush
    sound:
      collection: ST14BugTigerScream
      params:
        volume: 6
  - type: ST14HiveMember
    caste: ST14CasteTiger

# The tiger's plates turn bullets better than flame
- type: damageModifierSet
  id: ST14BugTigerCarapace
  coefficients:
    Piercing: 0.8
    Blunt: 0.9
    Slash: 0.9
    Heat: 1.2

# Shield around a warrior locked in a living barricade: catches bullets and lasers, lets bodies through.
# The bullets hurt the wall instead of the shield
- type: entity
  id: ST14LivingBarricadeShield
  categories: [ HideSpawnMenu ]
  components:
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      shield:
        shape:
          !type:PhysShapeCircle
          radius: 0.75
        hard: true
        layer:
        - Opaque
        - BulletImpassable
  - type: Damageable
  - type: ST14BarricadeShield
