# The edge of the map: a standing wall of sandstorm. Draw it with the mapping tools along the border of a map.
# The outer tile next to open ground is the fringe: you can wade into it at a crawl, bullets fly through.
# Deeper in nothing walks or shoots through, and the storm itself hides what is behind it.
# Nothing damages it, and it cannot be unanchored or deconstructed.
- type: entity
  id: ST14SandstormWall
  name: sandstorm
  description: A howling wall of sand that never settles. Whatever goes in does not come out.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: ST14SandstormWall
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - WallLayer
  # only the fringe is soft enough to step into
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.35
    sprintSpeedModifier: 0.35
  # the storm is painted by a client overlay across all tiles at once; this sprite is the icon in menus,
  # the client hides it as soon as the tile is on a grid
  - type: Sprite
    sprite: _ST14/Effects/Sandstorm/screen.rsi
    state: screen
    scale: 0.125, 0.125
  - type: AmbientSound
    volume: -4
    range: 9
    sound:
      path: /Audio/_ST14/Ambience/sandstorm_wind.ogg
  - type: Tag
    tags:
    - ST14Sandstorm
