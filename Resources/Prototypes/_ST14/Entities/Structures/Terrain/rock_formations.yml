# Mapping helpers: the old random-sprite ids now spawn one of the fitted rocks.
- type: entity
  parent: MarkerBase
  id: ST14RockFormation
  name: random rocks spawner
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _ST14/Structures/Terrain/rock_formations.rsi
      state: rockFormation1
  - type: EntityTableSpawner
    table: !type:GroupSelector
      children:
      - id: ST14RockFormation1
      - id: ST14RockFormation2Left
      - id: ST14RockFormation2Right
      - id: ST14RockFormation3Left
      - id: ST14RockFormation3Right
      - id: ST14RockFormation4
      - id: ST14RockFormationShortRocks
    offset: 0.0

- type: entity
