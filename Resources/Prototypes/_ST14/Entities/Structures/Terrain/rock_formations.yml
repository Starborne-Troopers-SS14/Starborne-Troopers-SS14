# Each rock is its own entity so the hitbox can follow that sprite's ground footprint.
# Polygons cover the lower three quarters of the opaque outline minus 14 px at the very bottom, so a mob
# can stand right against the rock. At most 8 vertices (physics limit).
- type: entity
  abstract: true
  parent: BaseStructure
  id: ST14RockFormationBase
  name: rocks
  description: A pile of weathered sandstone, worn by wind and grit.
  placement:
    mode: SnapgridCenter
  components:
  # Same draw depth as mobs so the rock y-sorts with them: walk behind it and it covers you.
  - type: Sprite
    sprite: _ST14/Structures/Terrain/rock_formations.rsi
    drawdepth: Mobs
    offset: 0, 0.78125
  - type: Icon
    sprite: _ST14/Structures/Terrain/rock_formations.rsi
  - type: Physics
    bodyType: Static
  - type: Tag
    tags:
    - Structure

- type: entity
  parent: ST14RockFormationBase
  id: ST14RockFormation1
  components:
  - type: Sprite
    state: rockFormation1
  - type: Icon
    state: rockFormation1
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
          vertices:
          - "-1.238,-0.041"
          - "1.174,-0.045"
          - "1.235,0.164"
          - "0.711,0.845"
          - "-0.311,0.815"
          - "-0.741,0.629"
          - "-0.953,0.402"
          - "-1.238,-0.011"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000

