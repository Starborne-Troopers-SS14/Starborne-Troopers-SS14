    anchored: true
  - type: Clickable
  - type: Sprite
    sprite: _ST14/Decals/holes.rsi
    drawdepth: FloorObjects
  - type: Icon
    sprite: _ST14/Decals/holes.rsi
  - type: Chasm
  - type: ST14Pit
  - type: Physics
    bodyType: Static
  - type: Tag
    tags:
    - HideContextMenu

