  name: Mobile Engineering Infantry fatigues
  description: The engineering corps field uniform without the jacket - an orange undershirt and reinforced-knee trousers.
  components:
  - type: Sprite
    sprite: _ST14/Clothing/Uniforms/Jumpsuit/engiuniform.rsi
    state: jacketless-icon
  - type: Clothing
    sprite: _ST14/Clothing/Uniforms/Jumpsuit/engiuniform.rsi
