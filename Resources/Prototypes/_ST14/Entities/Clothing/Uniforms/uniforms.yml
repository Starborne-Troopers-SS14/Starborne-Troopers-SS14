- type: entity
  parent: ClothingUniformBase
  id: ST14JumpsuitInfantryUniform
  name: Mobile Infantry uniform
  description: Field uniform of the Federation trooper - a padded grey jacket with black inserts and rank epaulettes, worn with reinforced-knee trousers. The winged Mobile Infantry emblem sits on the chest, with unit patches on the shoulders.
  components:
  - type: Sprite
    sprite: _ST14/Clothing/Uniforms/Jumpsuit/infantryuniform.rsi
  - type: Clothing
    sprite: _ST14/Clothing/Uniforms/Jumpsuit/infantryuniform.rsi
  # закатанные рукава: состояние sleeves-equipped-INNERCLOTHING
  - type: ST14RollableSleeves

- type: entity
  parent: ClothingUniformBase
  id: ST14JumpsuitEngineeringUniform
  name: Mobile Engineering Infantry uniform
  description: Field uniform of the engineering corps - a padded grey jacket with black inserts and rank epaulettes, worn with reinforced-knee trousers. The corps insignia sits on the chest.
  components:
  - type: Sprite
    sprite: _ST14/Clothing/Uniforms/Jumpsuit/engiuniform.rsi
  - type: Clothing
    sprite: _ST14/Clothing/Uniforms/Jumpsuit/engiuniform.rsi
  # закатанные рукава: состояние sleeves-equipped-INNERCLOTHING
  - type: ST14RollableSleeves
  - type: ST14EngineerSuit
    requiredJob: ST14Engineer

