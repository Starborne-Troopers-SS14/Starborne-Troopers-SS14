- type: entity
  parent: DefibrillatorOneHandedUnpowered
  id: ST14FieldDefibrillator
  name: field defibrillator
  description: Charge it on the patient, fire it in the green. Shout before you do.
  suffix: ""
  components:
  - type: ItemToggle
    activated: true
    soundActivate:
      path: /Audio/Items/Defib/defib_safety_on.ogg
    soundDeactivate:
      path: /Audio/Items/Defib/defib_safety_off.ogg
  - type: Defibrillator
    zapHeal:
      types:
        Asphyxiation: -40
    zapDelay: 30
  - type: ST14FieldDefib
    goodHeal:
      types:
        Asphyxiation: -100
        Slash: -20
        Piercing: -20
        Blunt: -20
