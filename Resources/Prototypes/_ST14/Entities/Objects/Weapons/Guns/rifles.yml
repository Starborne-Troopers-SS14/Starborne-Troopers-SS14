- type: entity
  name: Morita carbine
  parent: BaseWeaponRifle
  id: ST14WeaponRifleMoritaCarbine
  description: The standard-issue Federation carbine. Lighter and handier than the full rifle, it trades reach for a faster swing in close quarters.
  components:
  - type: Sprite
    sprite: _ST14/Objects/Weapons/Guns/Rifles/moritacarbine/icon.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Item
    sprite: _ST14/Objects/Weapons/Guns/Rifles/moritacarbine/32x32.rsi
  - type: Clothing
    sprite: _ST14/Objects/Weapons/Guns/Rifles/moritacarbine/32x32.rsi
  - type: Gun
    fireRate: 10
    soundGunshot:
      collection: ST14MoritaCarbineFire
      params:
        variation: 0.04
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/_ST14/SoundCollections/Weapons/Rifles/MoritaMK1Carbine/A_MoritaMK1Rifle_Bolt_01.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: ST14MagazineMorita
        insertSound:
          collection: ST14MoritaCarbineMagIn
        ejectSound: /Audio/_ST14/SoundCollections/Weapons/Rifles/MoritaMK1Carbine/A_MoritaMK1Rifle_reload_magout_01.ogg
        priority: 2
        whitelist:
          tags:
          - ST14MagazineMorita
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
          - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

