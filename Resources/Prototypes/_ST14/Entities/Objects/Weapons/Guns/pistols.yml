- type: entity
  name: Engineer pistol
  parent: BaseWeaponPistol
  id: ST14WeaponEngineerPistol
  description: A compact sidearm issued to engineering troops. Not much stopping power, but it is always within reach.
  components:
  - type: Sprite
    sprite: _ST14/Objects/Specific/Engineering/builderrpistol.rsi
    layers:
    - state: icon
  - type: Item
    sprite: _ST14/Objects/Specific/Engineering/builderrpistol.rsi
    storedOffset: 0,-2
  - type: Clothing
    sprite: _ST14/Objects/Specific/Engineering/builderrpistol.rsi
  - type: Gun
    fireRate: 5
    availableModes:
    - SemiAuto
  - type: StealTarget
    stealGroup: OfficerHandgun

- type: entity
  name: Peacemaker
  parent: BaseWeaponPistol
  id: ST14WeaponPistolPeacemaker
  description: The standard-issue Mobile Infantry sidearm. Fast-firing and reliable, the last line of defence when the rifle runs dry.
  components:
  - type: Sprite
    sprite: _ST14/Objects/Weapons/Guns/Pistols/peacemaker.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Item
    sprite: _ST14/Objects/Weapons/Guns/Pistols/peacemaker.rsi
  - type: Clothing
    sprite: _ST14/Objects/Weapons/Guns/Pistols/peacemaker.rsi
  - type: Gun
    fireRate: 6.67
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: ST14PeacemakerFire
      params:
        variation: 0.04
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/_ST14/SoundCollections/Weapons/Pistols/Peacemaker/A_Peacemaker_slide_01.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: ST14MagazinePeacemaker
        insertSound: /Audio/_ST14/SoundCollections/Weapons/Pistols/Peacemaker/A_Peacemaker_magin_01.ogg
        ejectSound: /Audio/_ST14/SoundCollections/Weapons/Pistols/Peacemaker/A_Peacemaker_magout_01.ogg
        priority: 2
        whitelist:
          tags:
          - ST14MagazinePeacemaker
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
          - CartridgePistol
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

- type: entity
  name: Emancipator
  parent: BaseWeaponPistol
  id: ST14WeaponPistolEmancipator
  description: A heavy-calibre sidearm. Slow and hard-kicking, but every round hits like a hammer.
  components:
  - type: Sprite
    sprite: _ST14/Objects/Weapons/Guns/Pistols/emancipator.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Item
    sprite: _ST14/Objects/Weapons/Guns/Pistols/emancipator.rsi
  - type: Clothing
    sprite: _ST14/Objects/Weapons/Guns/Pistols/emancipator.rsi
  - type: Gun
    fireRate: 3
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: ST14EmancipatorFire
      params:
        variation: 0.04
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: ST14MagazineEmancipator
        insertSound: /Audio/_ST14/SoundCollections/Weapons/Pistols/Emancipator/A_Emancipator_MagIn_01.ogg
        ejectSound: /Audio/_ST14/SoundCollections/Weapons/Pistols/Emancipator/A_Emancipator_MagOut_01.ogg
        priority: 2
        whitelist:
          tags:
          - ST14MagazineEmancipator
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
          - CartridgePistol
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
