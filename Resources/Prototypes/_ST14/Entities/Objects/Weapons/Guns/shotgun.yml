- type: entity
  name: Shotgun
  parent: BaseWeaponShotgun
  id: ST14WeaponShotgun
  description: A magazine-fed combat shotgun. Devastating at close range, where most bug fights end up anyway.
  components:
  - type: Sprite
    sprite: _ST14/Objects/Weapons/Guns/Shotguns/shotguns/icon.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Item
    sprite: _ST14/Objects/Weapons/Guns/Shotguns/shotguns/32x32.rsi
  - type: Clothing
    sprite: _ST14/Objects/Weapons/Guns/Shotguns/shotguns/32x32.rsi
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_ST14/Weapons/gun_mk2_fire.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/_ST14/Weapons/gun_mk2_reload.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: ST14MagazineShotgun
        insertSound: /Audio/_ST14/Weapons/gun_mk2_reload.ogg
        ejectSound: /Audio/_ST14/Weapons/gun_mk2_reload.ogg
        priority: 2
        whitelist:
          tags:
          - ST14MagazineShotgun
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
          - ShellShotgun
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
