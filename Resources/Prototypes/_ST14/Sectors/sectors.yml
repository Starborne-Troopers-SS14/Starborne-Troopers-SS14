# Sector rounds of the galactic war: every hex sector of a war planet is a 200x200 map cut as a hexagon, with the sandstorm
# along its edges, a passage on each of the six edges, the troopers landing on the left and the hive on the right.
# st14_sector_template makes a blank one. See docs/st14-sector-war.md.

- type: st14SectorSettings
  id: Default
  queens: 2
  queen: ST14MobBugQueen
  gracePeriod: 120
  checkInterval: 5
  roundLimit: 14400
  trashComponents: [ Puddle ]
  unsaveableComponents: [ KillTracker ]
  trashDecalTags: [ ST14BloodSplatter, ST14BloodDrip, ST14BloodPool, ST14BugBlood ]

# One kind of ground per terrain of the galaxy map (index = terrain number from 0). Add the mappers' map files to each list.
- type: st14SectorTerrain
  id: ST14SectorRockWastes
  index: 0
  maps: [ /Maps/_ST14/Sectors/template.yml ]

- type: st14SectorTerrain
  id: ST14SectorCanyons
  index: 1
  maps: [ /Maps/_ST14/Sectors/template.yml ]

- type: st14SectorTerrain
  id: ST14SectorHiveField
  index: 2
  maps: [ /Maps/_ST14/Sectors/template.yml ]

- type: st14SectorTerrain
  id: ST14SectorCraters
  index: 3
  maps: [ /Maps/_ST14/Sectors/template.yml ]

- type: st14SectorTerrain
  id: ST14SectorDunes
  index: 4
  maps: [ /Maps/_ST14/Sectors/template.yml ]

- type: st14SectorTerrain
  id: ST14SectorPlateau
  index: 5
  maps: [ /Maps/_ST14/Sectors/template.yml ]

# The game map of a sector round: a speck of ground that only makes the station, the sectors load on maps of their own
- type: gameMap
  id: ST14SectorWar
  mapName: Sector
  mapPath: /Maps/_ST14/Sectors/anchor.yml
  minPlayers: 0
  stations:
    Sector:
      stationProto: ST14SectorStation
      components:
      - type: StationNameSetup
        mapNameTemplate: "Sector"
      - type: StationJobs
        availableJobs:
          ST14Engineer: [ -1, -1 ]
          ST14Medic: [ -1, -1 ]
          ST14Bug: [ -1, -1 ]
          ST14BrainBug: [ 1, 1 ]

# The station of a sector round: jobs and spawning, nothing of a space station
- type: entity
  id: ST14SectorStation
  parent:
  - BaseStation
  - BaseStationJobsSpawning
  - BaseStationRecords
  - BaseStationAlertLevels
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform

- type: entity
  parent: SpawnPointJobBase
  id: ST14SpawnPointEngineer
  name: engineer
  components:
  - type: SpawnPoint
    job_id: ST14Engineer
  - type: Sprite
    layers:
    - state: green

# A place the hive queen may be put at the start of a sector round
- type: entity
  parent: MarkerBase
  id: ST14SectorQueenSlot
  name: queen place
  suffix: Sector
  components:
  - type: ST14SectorQueenSlot
  - type: Sprite
    layers:
    - state: red

# A passage on an edge of a sector map into the neighbouring sector: edge 0 is east, then counter-clockwise
- type: entity
  id: ST14SectorGateBase
  abstract: true
  name: sector passage
  description: Beyond the storm lies the next sector. It can only be walked into once the sector has been fought over.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      gate:
        shape:
          !type:PhysShapeCircle
          radius: 2.5
        mask:
        - FullTileMask
        - GhostImpassable
        layer:
        - WallLayer
        hard: false
  - type: Sprite
    sprite: Markers/cross.rsi
    state: blue
    drawdepth: FloorObjects

- type: entity
  parent: ST14SectorGateBase
  id: ST14SectorGateEast
  suffix: East
  components:
  - type: ST14SectorGate
    edge: 0

- type: entity
  parent: ST14SectorGateBase
  id: ST14SectorGateNorthEast
  suffix: North-east
  components:
  - type: ST14SectorGate
    edge: 1

- type: entity
  parent: ST14SectorGateBase
  id: ST14SectorGateNorthWest
  suffix: North-west
  components:
  - type: ST14SectorGate
    edge: 2

- type: entity
  parent: ST14SectorGateBase
  id: ST14SectorGateWest
  suffix: West
  components:
  - type: ST14SectorGate
    edge: 3

- type: entity
  parent: ST14SectorGateBase
  id: ST14SectorGateSouthWest
  suffix: South-west
  components:
  - type: ST14SectorGate
    edge: 4

- type: entity
  parent: ST14SectorGateBase
  id: ST14SectorGateSouthEast
  suffix: South-east
  components:
  - type: ST14SectorGate
    edge: 5
