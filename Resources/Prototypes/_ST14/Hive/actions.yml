- type: entity
  parent: BaseAction
  id: ST14ActionHiveEvolve
  name: Evolution
  description: Open the evolution menu of the hive.
  components:
  - type: Action
    itemIconStyle: BigAction
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    sprite: _ST14/Mobs/Bugs/warrior.rsi
    layers:
    - state: alive
  - type: InstantAction
    event: !type:ST14HiveEvolveActionEvent

- type: entity
  parent: BaseAction
  id: ST14ActionEatCorpse
  name: Eat corpse
  description: Tear biomass out of a corpse to grow into your first caste.
  components:
  - type: Action
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/devour.rsi
    layers:
    - state: icon
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:ST14EatCorpseActionEvent

- type: entity
  parent: BaseAction
  id: ST14ActionBrainSuck
  name: Suck the brain
  description: Pierce the skull of a live trooper and suck out the brain. The hive gets points, the trooper is gone for good.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 5
  - type: Sprite
    sprite: _ST14/Mobs/Bugs/brain.rsi
    layers:
    - state: sucking
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - HumanoidProfile
    event: !type:ST14BrainSuckActionEvent

- type: entity
  parent: BaseAction
  id: ST14ActionBugLunge
  name: Lunge
  description: Leap at a point. The first trooper in the way is knocked down and wounded.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 8
  - type: Sprite
    sprite: _ST14/Mobs/Bugs/warrior.rsi
    layers:
    - state: alive
  - type: TargetAction
    range: 6
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:ST14BugLungeActionEvent

- type: entity
  parent: BaseAction
  id: ST14ActionBugRend
  name: Rend
  description: Spin and slash every trooper around you. Those caught are staggered.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 12
  - type: Sprite
    sprite: _ST14/Mobs/Bugs/tiger.rsi
    layers:
    - state: alive
  - type: InstantAction
    event: !type:ST14BugRendActionEvent

- type: entity
  parent: BaseAction
  id: ST14ActionBugGrab
  name: Grip of the hive
  description: Clamp a trooper in your claws and drag it to the brain bug, who starts sucking right away. Press again to let go.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 20
  - type: Sprite
    sprite: _ST14/Interface/Actions/bug_abilities.rsi
    layers:
    - state: grab
  - type: TargetAction
    range: 1.5
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:ST14BugGrabActionEvent

- type: entity
  parent: BaseAction
  id: ST14ActionBugBarricade
  name: Living barricade
  description: Lock bodies with up to three warriors around you into a wall. Bullets break on it and the wounds are shared, but nobody in it can walk. Press again to break the wall.
  components:
  - type: Action
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _ST14/Interface/Actions/bug_abilities.rsi
    layers:
    - state: barricade
  - type: InstantAction
    event: !type:ST14BugBarricadeActionEvent

- type: entity
  parent: BaseAction
  id: ST14ActionBugExecute
  name: Execution
  description: Leap at a trooper. A badly wounded one dies on the spot, heals you and lets you leap again at once. A healthy one only takes a blow.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 15
  - type: Sprite
    sprite: _ST14/Interface/Actions/bug_abilities.rsi
    layers:
    - state: execute
  - type: TargetAction
    range: 6
    checkCanAccess: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState
    event: !type:ST14BugExecuteActionEvent
