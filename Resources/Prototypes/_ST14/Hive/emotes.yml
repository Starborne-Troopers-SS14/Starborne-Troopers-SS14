# Bug emotes for the emote wheel (Y). Only bugs of the hive see them; each caste plays them with its own voice.
- type: emote
  id: ST14BugScreech
  name: st14-emote-name-bug-screech
  category: Vocal
  icon: Interface/Emotes/scream.png
  whitelist:
    components:
    - ST14HiveMember
  chatMessages: [ "st14-emote-msg-bug-screech" ]
  chatTriggers:
  - визг
  - визжит

