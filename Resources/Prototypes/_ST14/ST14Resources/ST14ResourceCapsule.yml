- type: entity
  parent: BaseItem
  id: ST14ResourceCapsule
  name: resource capsule
  description: A sealed capsule for carrying extracted resources. Fits any drill.
  components:
  - type: Sprite
    sprite: _ST14/Structures/ST14Resources/bluegoo/32x32.rsi
    layers:
    - state: base
      map: [ "fill" ]
  - type: Item
    size: Normal
    sprite: _ST14/Structures/ST14Resources/bluegoo/32x32.rsi
    inhandVisuals:
      left:
      - state: inhand
      right:
      - state: inhand
  - type: ST14TwoHandedItem
  - type: Appearance
  - type: ST14ResourceCapsule
    capacity: 2000
  - type: ST14ResourceCapsuleVisuals
    applyColor: false
    fillStates:
    - base       # пустая
    - filled-3   # мало
    - filled-2   # половина
    - filled-1   # полная
    emptySprite: _ST14/Structures/ST14Resources/bluegoo/32x32.rsi
    sprites:
      Armium: _ST14/Structures/ST14Resources/bluegoo/32x32.rsi
      Auron: _ST14/Structures/ST14Resources/yellowgoo/32x32.rsi
  - type: Clothing
    slots: NONE
    quickEquip: false

- type: entity
  parent: ST14ResourceCapsule
  id: ST14ResourceCapsuleArmiumFilled
  suffix: Armium, Filled
  components:
  - type: ST14ResourceCapsule
    resourceType: Armium
    amount: 2000

- type: entity
  parent: ST14ResourceCapsule
  id: ST14ResourceCapsuleAuronFilled
  suffix: Auron, Filled
  components:
  - type: ST14ResourceCapsule
    resourceType: Auron
    amount: 2000

- type: entity
  parent: ST14ResourceCapsule
  id: ST14ResourceCapsuleNeftFilled
  suffix: Neft, Filled
  components:
  - type: ST14ResourceCapsule
    resourceType: Neft
    amount: 2000
