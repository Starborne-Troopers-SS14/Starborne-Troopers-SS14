- type: job
  id: ST14Engineer
  name: st14-job-name-engineer
  description: st14-job-description-engineer
  playTimeTracker: JobST14Engineer
  startingGear: ST14EngineerGear
  icon: JobIconST14Engineer
  supervisors: st14-job-supervisors-engineer
  special:
  - !type:AddComponentSpecial
    components:
    - type: ST14SquadRadio
    - type: IntrinsicRadioReceiver
    - type: ActiveRadio
      channels:
      - ST14Squad
      - ST14Rodger
  - !type:ST14EquipItemSpecial
    slot: capsule
    prototype: ST14ResourceCapsuleArmiumFilled

- type: startingGear
  id: ST14EngineerGear
  equipment:
    jumpsuit: ST14JumpsuitEngineeringUniform
    head: ST14ClothingHeadHelmetEngineer
    gloves: ST14ClothingHandsGlovesEngineer
    belt: ST14ClothingBeltEngineer
    shoes: ST14ClothingShoesCombatBoots
    back: ST14ClothingBackpackEngineer
  inhand:
  - ST14EngineerMultitool
  storage:
    back:
    - ST14FieldKit

- type: playTimeTracker
  id: JobST14Engineer

- type: jobIcon
  parent: JobIcon
  id: JobIconST14Engineer
  icon:
    sprite: /Textures/Interface/Misc/job_icons.rsi
    state: StationEngineer
  jobName: st14-job-name-engineer
