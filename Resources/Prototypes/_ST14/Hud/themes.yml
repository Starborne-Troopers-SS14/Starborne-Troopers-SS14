# ST14: the official SS14 HUD, only the small bar slots (pockets, belt, back, ID, a slot with an item) are drawn
# full size, so every slot of the bar has the same frame. Everything else falls back to the Default theme.
- type: uiTheme
  id: ST14Theme
  path: /Textures/_ST14/Interface/Hud/
  colors:
    whiteText: "#FFF5EE"
    slotSelectedGold: "#e6b812"
    slotColor: "#0f1215"
    slotOutline: "#333850"
    slotText: "#333850"
    nanoGold: "#A88B5E"
    goodGreenFore: "#31843E"
    concerningOrangeFore: "#A5762F"
    dangerousRedFore: "#BB3232"
    disabledFore: "#5A5A5A"
    _itemstatus_content_margin_right: "#06060404"
    _itemstatus_content_margin_left: "#04060604"
    _itemstatus_patch_margin: "#07060404"
