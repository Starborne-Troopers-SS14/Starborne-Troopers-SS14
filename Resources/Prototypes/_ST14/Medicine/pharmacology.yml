# What each drug does in a wounded body, at full strength (fullDose units in the blood). Read by ST14WoundSystem
# every second. Effects of less than a full dose scale down, past the overdose they start to harm.
# The ids match the reagents, so an interaction lists drugs by their reagent names.

# Painkillers and anaesthesia

- type: st14Drug
  id: ST14Morphine
  reagent: ST14Morphine
  fullDose: 10
  overdose: 20
  summary: st14-drug-summary-morphine
  painRelief: 62
  sedation: 1
  heartLoad: -0.15
  pulse: -16
  overdoseBreathing: 1.5
  overdosePopup: st14-drug-morphine-overdose

- type: st14Drug
  id: ST14Ketorolac
  reagent: ST14Ketorolac
  fullDose: 10
  overdose: 25
  summary: st14-drug-summary-ketorolac
  painRelief: 28
  bleeding: 0.35
  overdoseDamage:
    types:
      Poison: 1
  overdosePopup: st14-drug-ketorolac-overdose

- type: st14Drug
  id: ST14Ketamine
  reagent: ST14Ketamine
  fullDose: 10
  overdose: 18
  summary: st14-drug-summary-ketamine
  painRelief: 95
  dissociation: 1
  pulse: -12
  overdoseBreathing: 1

- type: st14Drug
  id: ST14Naloxone
  reagent: ST14Naloxone
  fullDose: 10
  overdose: 20
  summary: st14-drug-summary-naloxone
  pulse: 10
  removes:
    ST14Morphine: 4

# The heart

- type: st14Drug
  id: ST14Adrenaline
  reagent: ST14Adrenaline
  fullDose: 10
  overdose: 30
  summary: st14-drug-summary-adrenaline
  painRelief: 15
  adrenergic: 1
  heartLoad: 0.45
  pulse: 55
  restartBonus: 0.3
  overdoseArrest: 0.01

- type: st14Drug
  id: ST14Atropine
  reagent: ST14Atropine
  fullDose: 8
  overdose: 15
  summary: st14-drug-summary-atropine
  sedation: -0.3
  heartLoad: 0.1
  pulse: 30
  removes:
    ST14BugVenom: 0.5
  overdosePulse: 30
  overdoseArrest: 0.01
  overdosePopup: st14-drug-atropine-overdose

- type: st14Drug
  id: ST14Amiodarone
  reagent: ST14Amiodarone
  fullDose: 10
  overdose: 20
  summary: st14-drug-summary-amiodarone
  heartLoad: -0.35
  pulse: -12
  rhythmGuard: 1
  restartBonus: 0.15
  overdosePulse: -30
  overdoseArrest: 0.02
  overdosePopup: st14-drug-amiodarone-overdose

# Stimulants

- type: st14Drug
  id: ST14CombatStim
  reagent: ST14CombatStim
  fullDose: 8
  overdose: 12
  summary: st14-drug-summary-stim
  stimulation: 1
  heartLoad: 0.55
  pulse: 45
  steady: 2
  crashAfter: 9
  overdoseArrest: 0.02
  wearOffPopup: st14-drug-crash

- type: st14Drug
  id: ST14Modafinil
  reagent: ST14Modafinil
  fullDose: 8
  overdose: 16
  summary: st14-drug-summary-modafinil
  sedation: -0.5
  heartLoad: 0.15
  pulse: 15
  steady: 1
  crashRelief: 2
  overdoseArrest: 0.01

# The blood

- type: st14Drug
  id: ST14Tranexamic
  reagent: ST14Tranexamic
  fullDose: 10
  overdose: 25
  summary: st14-drug-summary-tranexamic
  bleeding: -0.35
  clotting: 0.02

- type: st14Drug
  id: ST14PlasmaExpander
  reagent: ST14PlasmaExpander
  fullDose: 10
  summary: st14-drug-summary-plasma
  bloodRestore: 3
  bleeding: 0.2
  clotting: -0.003

# Healing

- type: st14Drug
  id: ST14Antibiotic
  reagent: ST14Antibiotic
  fullDose: 10
  overdose: 30
  summary: st14-drug-summary-antibiotic
  antiInfection: 0.004

- type: st14Drug
  id: ST14Antipyretic
