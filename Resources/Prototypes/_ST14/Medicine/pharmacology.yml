  painRelief: 12
  feverRelief: 1
  overdoseDamage:
    types:
      Poison: 1.5
  overdosePopup: st14-drug-antipyretic-overdose

- type: st14Drug
  id: ST14Osteogen
  reagent: ST14Osteogen
  fullDose: 6
  overdose: 20
  summary: st14-drug-summary-osteogen
  boneGrowth: 0.012
  pulse: 5

- type: st14Drug
  id: ST14Regenerol
