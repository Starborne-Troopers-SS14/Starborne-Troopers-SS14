  pulse: 20
  warning: st14-scan-warn-atropine-adrenaline
  popup: st14-interaction-heart-pounding

- type: st14DrugInteraction
  id: ST14AtropineAmiodarone
  drugs: [ ST14Atropine, ST14Amiodarone ]
