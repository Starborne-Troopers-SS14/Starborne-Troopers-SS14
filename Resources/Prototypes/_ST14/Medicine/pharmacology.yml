    ST14Atropine: 0.4
    ST14Amiodarone: 0.4
  warning: st14-scan-warn-atropine-amiodarone

- type: st14DrugInteraction
  id: ST14AmiodaroneMorphine
  drugs: [ ST14Amiodarone, ST14Morphine ]
  pulse: -18
  arrest: 0.003
  warning: st14-scan-warn-bradycardia
  popup: st14-interaction-slow-heart

- type: st14DrugInteraction
  id: ST14ModafinilStim
