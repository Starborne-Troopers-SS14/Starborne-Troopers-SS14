  warning: st14-scan-warn-modafinil-stim
  popup: st14-interaction-heart-pounding

- type: st14DrugInteraction
  id: ST14KetamineStim
  drugs: [ ST14Ketamine, ST14CombatStim ]
  heartLoad: 0.2
  dissociation: 0.3
  warning: st14-scan-warn-ketamine-stim
  popup: st14-interaction-bad-trip

- type: st14DrugInteraction
  id: ST14PlasmaTranexamic
  drugs: [ ST14PlasmaExpander, ST14Tranexamic ]
