  fullDose: 10
  overdose: 20
  summary: st14-drug-summary-regenerol
  regeneration: 3
  heartLoad: 0.1
  pulse: 10
  overdoseDamage:
    types:
      Poison: 0.5

- type: st14Drug
  id: ST14Antivenom
  reagent: ST14Antivenom
  fullDose: 8
  overdose: 30
  summary: st14-drug-summary-antivenom
  removes:
    ST14BugVenom: 2

# What is in the blood but is no medicine

- type: st14Drug
  id: ST14BugVenom
  reagent: ST14BugVenom
  fullDose: 10
  overdose: 12
  summary: st14-drug-summary-venom
  painRelief: -15
  toxin: 1
  heartLoad: 0.1
  pulse: 10
  overdoseBreathing: 1.2
  overdosePopup: st14-venom-breathing

- type: st14Drug
  id: Ethanol
  reagent: Ethanol
  fullDose: 15
  summary: st14-drug-summary-alcohol
  painRelief: 10
  sedation: 0.3
  bleeding: 0.25
  pulse: 5

# What they do together

- type: st14DrugInteraction
  id: ST14StimAdrenaline
  drugs: [ ST14CombatStim, ST14Adrenaline ]
  heartLoad: 0.3
  warning: st14-scan-warn-stim-adrenaline
  popup: st14-interaction-heart-pounding

- type: st14DrugInteraction
  id: ST14Speedball
  drugs: [ ST14Morphine, ST14CombatStim ]
  minStrength: 0.3
  heartLoad: 0.2
  warning: st14-scan-warn-speedball
  popup: st14-interaction-heart-pounding

- type: st14DrugInteraction
  id: ST14MorphineAlcohol
  drugs: [ ST14Morphine, Ethanol ]
  breathing: 1
  sedation: 0.3
  warning: st14-scan-warn-morphine-alcohol
  popup: st14-interaction-heavy-breath

- type: st14DrugInteraction
  id: ST14MorphineVenom
  drugs: [ ST14Morphine, ST14BugVenom ]
  minStrength: 0.2
  breathing: 1.5
  warning: st14-scan-warn-morphine-venom
  popup: st14-interaction-heavy-breath

- type: st14DrugInteraction
  id: ST14KetorolacTranexamic
  drugs: [ ST14Ketorolac, ST14Tranexamic ]
  weakens:
    ST14Tranexamic: 0.3
  warning: st14-scan-warn-ketorolac-tranexamic

- type: st14DrugInteraction
  id: ST14KetorolacAlcohol
  drugs: [ ST14Ketorolac, Ethanol ]
  bleeding: 0.2
  warning: st14-scan-warn-ketorolac-alcohol

- type: st14DrugInteraction
  id: ST14AtropineAdrenaline
