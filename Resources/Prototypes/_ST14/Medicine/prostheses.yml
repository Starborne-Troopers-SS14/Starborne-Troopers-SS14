# Prostheses: the parts that go into the body, and the items fitted to a stump. Military steel limbs,
# the body sprites are cut from the worn sprite of the whole limb into the limb and the hand or foot

- type: entity
  abstract: true
  id: ST14ProsthesisSteelPart
  components:
  - type: Sprite
    sprite: _ST14/Mobs/prostheses.rsi
  - type: VisualOrgan
    data:
      sprite: _ST14/Mobs/prostheses.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Human
  - type: ST14Prosthesis

- type: entity
  parent: [ OrganBaseArmLeft, ST14ProsthesisSteelPart ]
  id: ST14OrganSteelArmLeft
  name: steel prosthetic left arm
  components:
  - type: Sprite
    state: steel_l_arm
  - type: VisualOrgan
    data:
      state: steel_l_arm

- type: entity
  parent: [ OrganBaseArmRight, ST14ProsthesisSteelPart ]
  id: ST14OrganSteelArmRight
  name: steel prosthetic right arm
  components:
  - type: Sprite
    state: steel_r_arm
  - type: VisualOrgan
    data:
      state: steel_r_arm

- type: entity
  parent: [ OrganBaseHandLeft, ST14ProsthesisSteelPart ]
  id: ST14OrganSteelHandLeft
  name: steel prosthetic left hand
  components:
  - type: Sprite
    state: steel_l_hand
  - type: VisualOrgan
    data:
      state: steel_l_hand

- type: entity
  parent: [ OrganBaseHandRight, ST14ProsthesisSteelPart ]
  id: ST14OrganSteelHandRight
  name: steel prosthetic right hand
  components:
  - type: Sprite
    state: steel_r_hand
  - type: VisualOrgan
    data:
      state: steel_r_hand

- type: entity
  parent: [ OrganBaseLegLeft, ST14ProsthesisSteelPart ]
  id: ST14OrganSteelLegLeft
  name: steel prosthetic left leg
  components:
  - type: Sprite
    state: steel_l_leg
  - type: VisualOrgan
    data:
      state: steel_l_leg

- type: entity
  parent: [ OrganBaseLegRight, ST14ProsthesisSteelPart ]
  id: ST14OrganSteelLegRight
  name: steel prosthetic right leg
  components:
  - type: Sprite
    state: steel_r_leg
  - type: VisualOrgan
    data:
      state: steel_r_leg

- type: entity
  parent: [ OrganBaseFootLeft, ST14ProsthesisSteelPart ]
  id: ST14OrganSteelFootLeft
  name: steel prosthetic left foot
  components:
  - type: Sprite
    state: steel_l_foot
  - type: VisualOrgan
    data:
      state: steel_l_foot

- type: entity
  parent: [ OrganBaseFootRight, ST14ProsthesisSteelPart ]
  id: ST14OrganSteelFootRight
  name: steel prosthetic right foot
  components:
  - type: Sprite
    state: steel_r_foot
  - type: VisualOrgan
    data:
      state: steel_r_foot


# The items. A steel one goes on a patient lying down in 20 seconds. The stump has to be sewn shut
# first, and without anaesthesia the patient screams through it

- type: entity
  parent: BaseItem
  abstract: true
  id: ST14ProsthesisBase
  components:
  - type: Item
    size: Normal
  - type: Sprite
    state: icon

- type: entity
  parent: ST14ProsthesisBase
  id: ST14SteelProsthesisArm
  name: steel arm prosthesis
  description: A military steel arm with a working hand. As good as the one the bugs took. Fitted to a patient lying down, onto a sewn stump.
  components:
  - type: Sprite
    sprite: _ST14/Objects/Specific/Medical/prosthesis_arm.rsi
  - type: Item
    sprite: _ST14/Objects/Specific/Medical/prosthesis_arm.rsi
  - type: ST14ProsthesisItem
    limb: Arm
    leftLimb: ST14OrganSteelArmLeft
    leftEnd: ST14OrganSteelHandLeft
    rightLimb: ST14OrganSteelArmRight
    rightEnd: ST14OrganSteelHandRight
    delay: 20
    needsLying: true
    fitSound:
      path: /Audio/Items/ratchet.ogg

- type: entity
  parent: ST14ProsthesisBase
  id: ST14SteelProsthesisLeg
  name: steel leg prosthesis
  description: A military steel leg. You walk and run on it as before. Fitted to a patient lying down, onto a sewn stump.
  components:
  - type: Sprite
    sprite: _ST14/Objects/Specific/Medical/prosthesis_leg.rsi
  - type: Item
    sprite: _ST14/Objects/Specific/Medical/prosthesis_leg.rsi
  - type: ST14ProsthesisItem
    limb: Leg
    leftLimb: ST14OrganSteelLegLeft
    leftEnd: ST14OrganSteelFootLeft
    rightLimb: ST14OrganSteelLegRight
    rightEnd: ST14OrganSteelFootRight
    delay: 20
    needsLying: true
    fitSound:
      path: /Audio/Items/ratchet.ogg
