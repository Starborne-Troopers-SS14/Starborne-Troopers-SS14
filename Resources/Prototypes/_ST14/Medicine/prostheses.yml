# The items. A field one goes on anywhere in 8 seconds, a steel one on a patient lying down in 20.
# Both need the stump sewn shut first, and without anaesthesia the patient screams through it
- type: entity
  parent: BaseItem
  abstract: true
  id: ST14ProsthesisBase
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _ST14/Mobs/prostheses.rsi

- type: entity
  parent: ST14ProsthesisBase
  id: ST14FieldProsthesisArm
  name: field arm prosthesis
  description: A wooden arm on leather straps with a hook for a hand. Crude, but it holds a rifle. Goes onto a sewn stump anywhere.
  components:
  - type: Sprite
    state: field_l_arm
  - type: ST14ProsthesisItem
    limb: Arm
    leftLimb: ST14OrganFieldArmLeft
    leftEnd: ST14OrganFieldHandLeft
    rightLimb: ST14OrganFieldArmRight
    rightEnd: ST14OrganFieldHandRight
    delay: 8
    fitSound:
      path: /Audio/Items/zip.ogg

- type: entity
  parent: ST14ProsthesisBase
  id: ST14FieldProsthesisLeg
  name: field leg prosthesis
  description: A peg leg on leather straps. You can walk on it, slower than before. Goes onto a sewn stump anywhere.
  components:
  - type: Sprite
    state: field_l_leg
  - type: ST14ProsthesisItem
    limb: Leg
    leftLimb: ST14OrganFieldLegLeft
    leftEnd: ST14OrganFieldFootLeft
    rightLimb: ST14OrganFieldLegRight
    rightEnd: ST14OrganFieldFootRight
    delay: 8
    fitSound:
      path: /Audio/Items/zip.ogg

- type: entity
  parent: ST14ProsthesisBase
  id: ST14SteelProsthesisArm
  name: steel arm prosthesis
  description: A military steel arm with a working hand. As good as the one the bugs took. Fitted to a patient lying down, onto a sewn stump.
  components:
  - type: Sprite
    state: steel_l_arm
  - type: ST14ProsthesisItem
    limb: Arm
    leftLimb: ST14OrganSteelArmLeft
    leftEnd: ST14OrganSteelHandLeft
    rightLimb: ST14OrganSteelArmRight
    rightEnd: ST14OrganSteelHandRight
    delay: 20
    needsLying: true
    fitSound:
      path: /Audio/Items/ratchet.ogg

- type: entity
  parent: ST14ProsthesisBase
  id: ST14SteelProsthesisLeg
  name: steel leg prosthesis
  description: A military steel leg. You walk and run on it as before. Fitted to a patient lying down, onto a sewn stump.
  components:
  - type: Sprite
    state: steel_l_leg
  - type: ST14ProsthesisItem
    limb: Leg
    leftLimb: ST14OrganSteelLegLeft
    leftEnd: ST14OrganSteelFootLeft
    rightLimb: ST14OrganSteelLegRight
    rightEnd: ST14OrganSteelFootRight
    delay: 20
    needsLying: true
    fitSound:
      path: /Audio/Items/ratchet.ogg
