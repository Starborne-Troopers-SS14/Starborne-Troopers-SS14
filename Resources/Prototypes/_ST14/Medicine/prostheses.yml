# Prostheses: the parts that go into the body, and the items fitted to a stump. The sprites are their own,
# drawn over the shape of the flesh limb: bare steel with seams and rivets, wood with leather straps, a hook, a peg

- type: entity
  abstract: true
  id: ST14ProsthesisFieldPart
  components:
  - type: Sprite
    sprite: _ST14/Mobs/prostheses.rsi
  - type: VisualOrgan
    data:
      sprite: _ST14/Mobs/prostheses.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Human
  - type: ST14Prosthesis
    field: true

