# What the troopers can shout. All of them in the emote menu, played in the trooper's own voice

- type: emote
  id: ST14Pain
  name: chat-emote-name-st14-pain
  category: Vocal
  icon: Interface/Emotes/scream.png
  whitelist:
    components:
    - Vocal
  chatMessages: ["chat-emote-msg-st14-pain"]
  chatTriggers:
  - охнуть
  - охает
  - grunt

