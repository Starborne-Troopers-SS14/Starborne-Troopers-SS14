# The voices of the troopers: five performers of each sex from the BOOM Library war crowds.
# Every sound of a voice is its own, none of the station voices: screams of agony, death cries, grunts,
# moans, war cries and shouted orders. Men pick from the male voices, women from the female ones

- type: emoteSounds
  id: ST14VoiceMale1
  sex: Male
  voiceSelectorName: st14-voice-male-1
  params:
    variation: 0.06
  sounds:
    ST14TearScream:
      collection: ST14VoiceMale1Tear
    Scream:
      collection: ST14VoiceMale1Scream
    DefaultDeathgasp:
      collection: ST14VoiceMale1Death
    ST14Pain:
      collection: ST14VoiceMale1Hit
    Gasp:
      collection: ST14VoiceMale1Hit
    ST14Groan:
      collection: ST14VoiceMale1Groan
    ST14WarCry:
      collection: ST14VoiceMale1Warcry
    ST14Hurrah:
      collection: ST14VoiceMale1Hurrah
    ST14Charge:
