  minDuration: 200
  maxDuration: 320
  rampUp: 80
  rampDown: 40
  ambient:
    path: /Audio/_ST14/Weather/Snow/blizzard.wav
    params:
      volume: 0
  speed: 0.92
  visual:
    particles: Snow
    count: 1400
    color: '#F0F4FFE0'
    speed: 3
    width: 0.08
    fog: 0.5
    fogColor: '#C8D4E8'
    fogColor2: '#FFFFFF'
    clouds: [ veil, puffy, wisps ]
    fogSpeed: 1.5
    tint: '#5070A030'
  effects:
  - !type:ST14WeatherExposureEffect
    interval: 8
    popup: st14-weather-cold-hurt
