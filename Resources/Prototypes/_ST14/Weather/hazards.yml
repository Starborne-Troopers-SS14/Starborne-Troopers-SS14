# Things the weather drops on a sector: a mark shows where it lands, then it hits

- type: entity
  id: ST14WeatherStrikeBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    sprite: _ST14/Effects/Weather/strike.rsi
    drawdepth: FloorObjects
    noRot: true

- type: entity
  parent: ST14WeatherStrikeBase
  id: ST14WeatherLightning
  name: lightning
  components:
  - type: Sprite
    layers:
    - state: glow
      shader: unshaded
      color: '#A0C0FF60'
  - type: ST14WeatherStrike
    delay: 0.9
    radius: 1.6
    damage:
      types:
        Shock: 22
        Heat: 8
    knockdown: 3
    impactSound:
      collection: ST14WeatherLightningStrike
      params:
        volume: 6
        maxDistance: 60
    effect: ST14WeatherBolt
    flash: true
    crater: [ ST14WeatherScorch1, ST14WeatherScorch2, ST14WeatherScorch3 ]
    craterSize: 1.5
    shakeRange: 12

# The look of the hits

- type: entity
  id: ST14WeatherDust
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    sprite: _ST14/Effects/Weather/strike.rsi
    state: dust
    drawdepth: Effects
    scale: 2, 2
    noRot: true
  - type: TimedDespawn
    lifetime: 0.72

- type: entity
  id: ST14WeatherBolt
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    sprite: _ST14/Effects/Weather/bolt.rsi
    drawdepth: Effects
    offset: 0, 6.4
    layers:
    - state: bolt
      shader: unshaded
    noRot: true
  - type: PointLight
    radius: 10
    energy: 8
    color: '#DDE6FF'
  - type: TimedDespawn
    lifetime: 0.3
